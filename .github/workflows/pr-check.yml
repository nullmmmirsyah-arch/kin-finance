name: PR Check

# Lightweight gate for PR feat/* -> review. No EAS, no secrets — just tsc/lint/test.
# Keeps review clean before manual Development build.
on:
  pull_request:
    branches: [review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
